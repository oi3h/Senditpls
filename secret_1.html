<style>
  /* Layout: one dark night page. Hero with a scratch card hiding the code, the features, three steps, the Omega signature. */
  :root {
    --ink: #0b0b10; --paper: #f4f1ff; --muted: rgba(244,241,255,.62);
    --pink: #ff90e8; --yellow: #ffc900; --lime: #b4ec6c; --blue: #7aa2f7; --violet: #9b7bff;
    --line: 1px solid rgba(255,255,255,.22); --r: 18px;
    --font: 'Heebo', system-ui, 'Segoe UI', Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: clip; }   /* the tilted ribbon pokes 1px past the edge */
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font); line-height: 1.6; overflow-x: hidden;
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .wrap { max-width: 1080px; margin: 0 auto; }
  a { color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* moving night sky */
  .sky { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
  .sky i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .5; animation: orbit 30s ease-in-out infinite alternate; }
  .sky i:nth-child(1) { background: var(--violet); top: -20vmax; right: -12vmax; }
  .sky i:nth-child(2) { background: var(--pink); bottom: -25vmax; left: -18vmax; animation-duration: 36s; opacity: .38; }
  .sky i:nth-child(3) { background: var(--blue); top: 40vh; left: 35vw; width: 35vmax; height: 35vmax; animation-duration: 42s; opacity: .3; }
  @keyframes orbit { 50% { transform: translate(10vmax, 8vmax) scale(1.15); } 100% { transform: translate(-8vmax, 12vmax) scale(.9); } }
  .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .55;
    background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 65%, #fff, transparent), radial-gradient(1px 1px at 10% 90%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 50%, #fff, transparent);
    background-size: 380px 380px; animation: twinkle 6s ease-in-out infinite alternate; }
  @keyframes twinkle { to { opacity: .25; } }

  .glass { background: linear-gradient(140deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); border: var(--line); border-radius: var(--r);
    -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); box-shadow: 5px 5px 0 #000, inset 0 1px 0 rgba(255,255,255,.25); }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 900; font-size: 19px; text-decoration: none; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; background: #fff; padding: 2px; }
  .hush { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .hush b { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* hero */
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding: 40px 0 70px; }
  .eyebrow { display: inline-flex; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; letter-spacing: .14em; padding: 6px 14px; border-radius: 999px;
    background: rgba(255,201,0,.14); border: 1px solid rgba(255,201,0,.5); color: var(--yellow); }
  h1 { font-size: clamp(44px, 7.4vw, 92px); line-height: .95; letter-spacing: -.04em; font-weight: 900; margin: 18px 0 16px; }
  h1 .glow { background: linear-gradient(90deg, var(--pink), var(--yellow), var(--lime), var(--blue), var(--pink)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 8s linear infinite; }
  @keyframes flow { to { background-position: 300% 0; } }
  .lead { font-size: 19px; color: var(--muted); max-width: 520px; margin: 0; }
  .lead strong { color: var(--paper); }

  /* the scratch card */
  .ticket { position: relative; padding: 26px 26px 22px; text-align: center; transform: rotate(-2deg); transition: transform .4s ease; }
  .ticket:hover { transform: rotate(0); }
  .ticket .lbl { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--muted); }
  .scratch { position: relative; margin: 14px auto 10px; width: 100%; max-width: 340px; height: 96px; border-radius: 14px; border: 2px dashed rgba(255,255,255,.35); overflow: hidden; }
  .code { position: absolute; inset: 0; display: grid; place-items: center; font: 900 clamp(30px, 6vw, 44px) var(--font); letter-spacing: .12em; direction: ltr;
    background: linear-gradient(135deg, #fff7c2, #ffd6f5 50%, #d9f6ff); color: #0b0b10; }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; transition: opacity .5s ease; }
  .scratch.done canvas { opacity: 0; pointer-events: none; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; min-height: 22px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 12px; border: 1px solid #000;
    font: 800 16px var(--font); color: #0b0b10; background: var(--yellow); box-shadow: 4px 4px 0 #000; cursor: pointer; text-decoration: none; transition: transform .15s, box-shadow .15s; }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }
  .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
  .btn.pink { background: var(--pink); }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--paper); border-color: rgba(255,255,255,.35); }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  /* ribbon */
  /* full-bleed in both directions; left/margin-left math breaks in RTL */
  .ribbon { position: relative; margin-inline: calc(50% - 50vw); overflow: hidden; border-block: 1px solid rgba(255,255,255,.18); padding: 14px 0;
    background: rgba(155,123,255,.12); transform: rotate(-1.5deg); }
  .ribbon .track { display: inline-flex; gap: 40px; white-space: nowrap; font-weight: 900; font-size: 22px; animation: slide 26s linear infinite; padding-inline-end: 40px; }
  .ribbon .track span { color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.7); }
  .ribbon .track span:nth-child(3n) { color: var(--yellow); -webkit-text-stroke: 0; }
  @keyframes slide { to { transform: translateX(50%); } }

  section { padding: 70px 0 10px; }
  h2 { font-size: clamp(30px, 4.6vw, 52px); line-height: 1.05; letter-spacing: -.03em; margin: 0 0 10px; font-weight: 900; }
  .sub { color: var(--muted); margin: 0 0 30px; font-size: 17px; }

  /* features */
  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .feat { padding: 22px; position: relative; overflow: hidden; transition: transform .25s ease; }
  .feat:hover { transform: translateY(-4px) rotate(-.6deg); }
  .feat .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; border: 1px solid #000; box-shadow: 3px 3px 0 #000; margin-bottom: 14px; }
  .feat h3 { margin: 0 0 6px; font-size: 20px; }
  .feat p { margin: 0; color: var(--muted); font-size: 15px; }
  /* party mode closes the grid as a full-width strip, so no row is left half-empty */
  .feat.wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .feat.wide .ic { margin: 0; }
  .feat.wide .kbd { margin: 0; margin-inline-start: auto; }
  .feat.big { grid-column: span 2; display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: center; }
  .demo-bg { height: 140px; border-radius: 14px; border: 1px solid rgba(255,255,255,.3); position: relative; overflow: hidden;
    background: linear-gradient(135deg, #ff90e8, #ffc900 45%, #7aa2f7); }
  .demo-bg::before { content: ''; position: absolute; inset: -20px; background: inherit; filter: blur(12px); animation: breathe 4s ease-in-out infinite alternate; }
  .demo-bg i { position: absolute; inset: 18px 22px auto; height: 30px; border-radius: 8px; background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1px solid #000; }
  .demo-bg i + i { top: 58px; inset-inline-end: 70px; }
  .demo-bg i + i + i { top: 96px; inset-inline-end: 36px; }
  @keyframes breathe { to { filter: blur(24px); transform: scale(1.1); } }
  .swatch { display: flex; gap: 6px; margin-top: 12px; }
  .swatch b { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #000; animation: hop 2.4s ease-in-out infinite; }
  .swatch b:nth-child(2) { animation-delay: .2s; } .swatch b:nth-child(3) { animation-delay: .4s; } .swatch b:nth-child(4) { animation-delay: .6s; } .swatch b:nth-child(5) { animation-delay: .8s; }
  @keyframes hop { 30% { transform: translateY(-6px); } 60% { transform: none; } }
  .kbd { display: inline-flex; gap: 4px; flex-wrap: wrap; direction: ltr; margin-top: 12px; }
  .kbd kbd { font: 700 13px var(--font); min-width: 26px; text-align: center; padding: 3px 6px; border-radius: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 2px 0 rgba(0,0,0,.6); }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
  .step { padding: 22px; counter-increment: s; }
  .step::before { content: counter(s); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; font-weight: 900; font-size: 18px;
    background: var(--pink); color: #0b0b10; border: 1px solid #000; box-shadow: 3px 3px 0 #000; margin-bottom: 12px; }
  .step:nth-child(2)::before { background: var(--yellow); } .step:nth-child(3)::before { background: var(--lime); }
  .step h3 { margin: 0 0 4px; font-size: 18px; }
  .step p { margin: 0; color: var(--muted); font-size: 15px; }

  footer { text-align: center; padding: 70px 0 calc(40px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 14px; }
  .madeby { display: inline-flex; align-items: center; gap: 14px; padding: 10px 14px 10px 22px; margin-bottom: 16px; border-radius: 999px; border: 1px solid #000; color: #111; text-decoration: none; font-weight: 800; font-size: 14px;
    background: linear-gradient(140deg, #fff, #f2e8ff 55%, #e3f6d2); box-shadow: 4px 4px 0 #000, inset 0 1.5px 0 #fff; transition: transform .25s ease; }
  .madeby:hover { transform: rotate(-2deg) scale(1.04); }
  .madeby small { display: block; font-weight: 500; font-size: 12px; color: rgba(0,0,0,.55); }
  .madeby img { height: 46px; width: auto; display: block; }

  .reveal { animation: rise both; animation-timeline: view(); animation-range: entry 0% entry 40%; }
  @keyframes rise { from { opacity: 0; translate: 0 30px; } to { opacity: 1; translate: 0 0; } }
  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; translate: -50% calc(100% + 40px); visibility: hidden; transition: translate .35s ease, visibility .35s; z-index: 50;
    background: var(--lime); color: #0b0b10; font-weight: 800; padding: 10px 18px; border-radius: 999px; border: 1px solid #000; box-shadow: 4px 4px 0 #000; }
  .toast.on { translate: -50% 0; visibility: visible; }
  canvas.boom { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }

  /* lock screen: a phone-style keypad over the night sky */
  .lock { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; overflow: auto; padding: 24px 16px;
    background: radial-gradient(120% 80% at 50% 0%, rgba(155,123,255,.28), transparent 60%), rgba(11,11,16,.55);
    -webkit-backdrop-filter: blur(26px) saturate(1.4); backdrop-filter: blur(26px) saturate(1.4);
    transition: transform .8s cubic-bezier(.7,0,.2,1), opacity .8s ease; }
  .lock.gone { transform: translateY(-100%); opacity: .4; }
  .lock-in { width: min(340px, 100%); text-align: center; }
  .clock { font-size: clamp(64px, 18vw, 88px); font-weight: 800; letter-spacing: -.04em; line-height: 1; direction: ltr; }
  .date { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .padlock { display: grid; place-items: center; width: 58px; height: 58px; margin: 26px auto 10px; border-radius: 50%; color: #0b0b10;
    background: var(--yellow); border: 1px solid #000; box-shadow: 4px 4px 0 #000; transition: background .3s; }
  .padlock .shackle { transition: transform .35s cubic-bezier(.3,1.6,.5,1); transform-origin: 16px 11px; }
  .padlock.open { background: var(--lime); }
  .padlock.open .shackle { transform: translateY(-3px) rotate(28deg); }
  .lock-title { font-size: 26px; font-weight: 900; margin: 0; letter-spacing: -.02em; }
  .lock-sub { color: var(--muted); margin: 4px 0 18px; min-height: 26px; font-size: 15px; }
  .dots { display: flex; gap: 16px; justify-content: center; margin-bottom: 26px; }
  .dots i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); transition: background .15s, transform .15s; }
  .dots i.on { background: #fff; transform: scale(1.1); }
  .dots.bad { animation: shake .45s ease; }
  .dots.bad i { border-color: #ff6b6b; background: #ff6b6b; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 16px 22px; justify-content: center; direction: ltr; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; font: 600 28px var(--font); color: var(--paper); cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25); transition: background .12s, transform .12s; -webkit-tap-highlight-color: transparent; }
  .pad button:hover { background: rgba(255,255,255,.2); }
  .pad button:active { background: var(--pink); color: #0b0b10; transform: scale(.94); }
  .pad button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .pad .del { background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; display: grid; place-items: center; }
  @media (max-height: 700px) { .clock { font-size: 52px; } .padlock { margin: 14px auto 6px; } .pad button { width: 62px; height: 62px; } .pad { grid-template-columns: repeat(3, 62px); gap: 12px 20px; } }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 30px; padding-top: 20px; }
    .feats, .steps { grid-template-columns: 1fr; }
    .feat.big { grid-column: auto; grid-template-columns: 1fr; }
    .feat.wide .kbd { margin-inline-start: 0; }
    .ticket { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; }
  }
</style>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-in">
    <div class="clock" id="clock" aria-hidden="true">--:--</div>
    <div class="date" id="today" aria-hidden="true"></div>
    <div class="padlock" id="padlock" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1 class="lock-title" id="lockTitle">הכניסה נעולה</h1>
    <p class="lock-sub" id="lockSub">הקלידו את הקוד בן 4 הספרות</p>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="sr" id="lockLive" role="status" aria-live="assertive"></p>
    <div class="pad" id="pad">
      <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
      <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
      <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
      <span aria-hidden="true"></span><button type="button" data-d="0">0</button><button type="button" class="del" data-del aria-label="מחק ספרה"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- lock screen ----------
  // the page content is AES-GCM encrypted with a key derived from the code; a wrong code simply fails to decrypt
  const vault = JSON.parse(document.getElementById('vault').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pin) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(vault.salt), iterations: vault.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(vault.iv) }, key, b64(vault.ct)));
  }
  const tick = () => { const d = new Date(); $('#clock').textContent = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); $('#today').textContent = d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }); };
  tick(); setInterval(tick, 10000);
  let pin = '', busy = false;
  const dots = [...document.querySelectorAll('#dots i')];
  const paint = () => dots.forEach((d, i) => d.classList.toggle('on', i < pin.length));
  async function press(d) {
    if (busy) return;
    if (d === 'del') pin = pin.slice(0, -1); else if (pin.length < 4) pin += d;
    paint();
    if (pin.length < 4) return;
    busy = true; $('#lockSub').textContent = 'בודק…';
    try { unlock(await open(pin), pin); }
    catch {
      $('#dots').classList.add('bad'); $('#lockSub').textContent = 'קוד שגוי, נסו שוב'; $('#lockLive').textContent = 'קוד שגוי';
      try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch {}
      setTimeout(() => { $('#dots').classList.remove('bad'); pin = ''; paint(); busy = false; }, 650);
    }
  }
  function unlock(html, code) {
    try { sessionStorage.setItem('sp_pin', code); } catch {}
    $('#locked').outerHTML = html;
    $('#padlock').classList.add('open'); $('#lockTitle').textContent = 'נפתח ✦'; $('#lockSub').textContent = ''; $('#lockLive').textContent = 'נפתח';
    initPage();
    const L = $('#lock'); setTimeout(() => L.classList.add('gone'), reduce ? 0 : 350);
    setTimeout(() => { L.remove(); boom(innerWidth / 2, innerHeight / 3); }, reduce ? 0 : 1100);
  }
  $('#pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.hasAttribute('data-del') ? 'del' : b.dataset.d); });
  addEventListener('keydown', e => { if (!$('#lock')) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); });
  // reopen silently within the same browser session
  (async () => { let saved = null; try { saved = sessionStorage.getItem('sp_pin'); } catch {} if (saved) { try { busy = true; unlock(await open(saved), saved); } catch { busy = false; } } })();

  // ---------- confetti ----------
  function boom(x, y) {
    if (reduce) return;
    const c = document.createElement('canvas'), ctx = c.getContext('2d'), d = devicePixelRatio || 1;
    c.className = 'boom'; c.width = innerWidth * d; c.height = innerHeight * d; ctx.scale(d, d); document.body.appendChild(c);
    const colors = ['#ff90e8', '#ffc900', '#b4ec6c', '#7aa2f7', '#ffffff', '#9b7bff'];
    const P = Array.from({ length: 170 }, () => { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 10;
      return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 7, w: 6 + Math.random() * 6, h: 4 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[(Math.random() * colors.length) | 0] }; });
    const t0 = performance.now();
    (function f(t) { const k = (t - t0) / 2600; ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of P) { p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
      if (k < 1) requestAnimationFrame(f); else c.remove(); })(t0);
  }

  function initPage() {
  const CODE = $('#code').textContent;

  const words = ['רקע מטושטש', 'מסך פתיחה', 'סימן מים', 'מצגת', 'לבבות', 'אורורה', 'קונפטי', 'מצב מסיבה', 'צבע משלך'];
  $('#track').innerHTML = [...words, ...words, ...words, ...words].map(w => `<span>${w} ✦</span>`).join('');

  // ---------- scratch card ----------
  const box = $('#scratch'), cv = $('#cover'), g = cv.getContext('2d');
  let revealed = false;
  function paintCover() {
    const r = box.getBoundingClientRect(), d = devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0);
    const grad = g.createLinearGradient(0, 0, r.width, r.height);
    grad.addColorStop(0, '#c9c9d6'); grad.addColorStop(.5, '#f2f2f8'); grad.addColorStop(1, '#a9a9ba');
    g.fillStyle = grad; g.fillRect(0, 0, r.width, r.height);
    g.fillStyle = 'rgba(11,11,16,.55)'; g.font = '800 15px Heebo, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('✦ גרדו כאן ✦', r.width / 2, r.height / 2);
    g.globalCompositeOperation = 'destination-out';
  }
  paintCover();
  addEventListener('resize', () => { if (!revealed) paintCover(); });
  let drawing = false, last = null, checks = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function scratch(e) {
    if (!drawing || revealed) return;
    const [x, y] = pos(e);
    g.lineWidth = 34; g.lineCap = 'round'; g.beginPath(); g.moveTo(...(last || [x, y])); g.lineTo(x, y); g.stroke(); last = [x, y];
    if (++checks % 6 === 0 && clearedShare() > .45) reveal();
  }
  // share of the cover already scratched away, sampled on a coarse grid
  function clearedShare() {
    const { width: w, height: h } = cv, data = g.getImageData(0, 0, w, h).data;
    let clear = 0, n = 0;
    for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 8) { n++; if (data[(y * w + x) * 4 + 3] < 40) clear++; }
    return clear / n;
  }
  cv.addEventListener('pointerdown', e => { drawing = true; last = null; cv.setPointerCapture(e.pointerId); scratch(e); });
  cv.addEventListener('pointermove', scratch);
  cv.addEventListener('pointerup', () => { drawing = false; last = null; });
  function reveal() {
    if (revealed) return;
    revealed = true; box.classList.add('done');
    $('#code').removeAttribute('aria-hidden');
    $('#hint').textContent = 'יש! הקוד שלך: ' + CODE;
    $('#copy').disabled = false; $('#peek').hidden = true;
    const r = box.getBoundingClientRect(); boom(r.left + r.width / 2, r.top + r.height / 2);
  }
  $('#peek').onclick = reveal;
  $('#copy').onclick = async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(CODE); ok = true; } catch {
      const t = document.createElement('textarea'); t.value = CODE; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
      try { ok = document.execCommand('copy'); } catch {} t.remove();
    }
    toast(ok ? 'הקוד הועתק ✓ עכשיו להדביק באפליקציה' : 'הקוד: ' + CODE);
  };
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

  }
</script>
